name: Build installers

on:
  push:
    branches: [main, claude/downloadable-app-installer-rb7t7q]
    paths: ['app/**', 'main.js', 'package.json', 'build/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Facturació Ortopèdia v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          body: |
            **Windows:** descarrega `Facturacio-Ortopedia-Setup.exe` i executa'l.
            **Mac:** descarrega `Facturacio-Ortopedia-Mac.dmg`, obre'l i arrossega l'app a Aplicacions.
          files: out/*
